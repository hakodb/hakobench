[package]
name = "vector-duel"
version = "0.1.0"
edition = "2021"

# Duel harness: hakodb (NoSQL-native vector) vs libsql/Turso (native
# vector). No workspace — standalone crate, run on the bench box.
[workspace]

[dependencies]
hakodb = "0.13.1"
libsql = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
